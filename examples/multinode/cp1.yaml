# A second control-plane node that JOINS cp0's cluster. See cp0.yaml.
#
# Bring cp0 up first. This node takes cp0's secrets bundle, in-cluster endpoint
# and kubeconfig from cp0's state directory, and never bootstraps etcd.
apiVersion: machine.hvf.fleet.io/v1alpha1
kind: TalosMachine
metadata:
  name: cp1
  namespace: default
spec:
  site: multinode
  role: talos-cp
  image: talos-v1.14.1-amd64.iso
  # ghcr.io/siderolabs/installer is not published for v1.14, so the default
  # installer pin cannot install this image. This is Image Factory's vanilla
  # installer (no extensions) for the same version.
  installerImage: factory.talos.dev/installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.1
  cpu: 2
  memory: 4Gi
  disk: 16Gi
  hostname: cp1
  joins: cp0
  clusterNetwork:
    cidr: 10.254.0.0/24
    address: 10.254.0.12
  hostForwards:
    - hostPort: 50011
      guestPort: 50000
    - hostPort: 6454
      guestPort: 6443
