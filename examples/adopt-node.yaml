# The ADOPTED node: a Talos machine this tool did not create.
#
# It is already booted into maintenance mode — from a USB stick, IPMI virtual
# media, or netboot — and `tinq adopt` drives it to a Ready single-node cluster
# using the same ten steps `up` uses. Nothing here powers a machine on.
#
# DELIBERATELY HAS NO systemDiskSerial. The first `tinq adopt` against a node is
# EXPECTED to refuse: it prints the node's real disks and stops, because a serial
# cannot be guessed and guessing wrong overwrites a disk that may hold data.
# Write one down from that table, uncomment it below, and run adopt again.
#
# For the rehearsal this points at the VM created by adopt-machine.yaml, so the
# address is this host's own LAN address. On real hardware it is the node's DHCP
# address and nothing else about this file changes.
#
# A DIFFERENT metadata.name from adopt-machine.yaml, on purpose: the name keys
# the state directory, and sharing one would put this node's talosconfig inside
# the VM's state dir — where `tinq destroy` would take it.
#
# NO PORT on endpoint. Talos's own defaults are used (50000 for apid, 6443 for
# kube-apiserver) because there is no forward to describe. Writing
# `192.168.1.165:50000` here produced `192.168.1.165:50000:50000` and hung for
# the full ten-minute budget before that was refused up front.
apiVersion: machine.hvf.fleet.io/v1alpha1
kind: TalosMachine
metadata:
  name: rehearsal-node0
  namespace: default
spec:
  site: rehearsal
  role: talos-cp
  baremetal:
    endpoint: 192.168.1.165
    # systemDiskSerial: talos-system   # uncomment after the first run prints it
    # dataDiskSerial: talos-data       # omit entirely for no PVC storage
