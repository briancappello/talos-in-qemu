# Adopt a bare-metal (or PXE-rehearsal) node into a single-node Talos cluster,
# with every image pulled from the seed over verified HTTPS.
#
# The node reaches maintenance mode by netbooting off the seed (dnsmasq +
# iPXE + the asset server), then:  tinq adopt seed/examples/seed-adopt.yaml
#
# registries: ghcr.io / docker.io / registry.lab all mirror through zot at
# registry.lab over HTTPS, verified against the seed's step-ca root (`caFile`,
# read on the host running tinq — NOT insecureSkipVerify, NOT http://).
# registry.k8s.io is deliberately NOT mirrored: the Kubernetes control-plane
# images pull straight from upstream through the seed's NAT, since zot's
# pull-through cache only syncs docker.io + ghcr.io.
#
# nameservers points at the seed, which is why registry.lab resolves inside the
# node; the seed is also the node's gateway (it NATs the boot segment out).
apiVersion: machine.hvf.fleet.io/v1alpha1
kind: TalosMachine
metadata:
  name: seed-rehearsal
spec:
  site: seed-lab
  role: talos-cp
  baremetal:
    maintenanceEndpoint: 192.168.50.77        # the guest's DHCP lease on the boot segment
    systemDiskSerial: pxenodesys              # the install target (first adopt run prints the disk table)
    network:
      address: 192.168.50.77/24               # the installed node re-pins to this (== maintenanceEndpoint)
      gateway: 192.168.50.1                    # the seed on the boot segment (routes/NATs to the internet)
      nameservers: [192.168.50.1]              # the seed = DNS, so registry.lab resolves in the node
      hardwareAddr: "52:54:00:5e:ed:60"
  registries:
    - { host: ghcr.io,      endpoint: https://registry.lab, caFile: /etc/ssl/seed/root_ca.crt }
    - { host: docker.io,    endpoint: https://registry.lab, caFile: /etc/ssl/seed/root_ca.crt }
    - { host: registry.lab, endpoint: https://registry.lab, caFile: /etc/ssl/seed/root_ca.crt }
