# Debian 13 (trixie) unattended, headless preseed for the physical seed host.
# Rendered by build-usb-installer.sh (which substitutes __ROOT_PW_HASH__ and
# __SSH_PUBKEY__). Comes up via DHCP with root SSH (key-only) so
# `ansible-playbook --limit seed-metal` can take over. NO static IP: gmtek owns
# .10 on both segments; the box is found by MAC after it boots.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — DHCP, do not stall headless
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/link_wait_timeout string 30
d-i netcfg/get_hostname string seed-metal
d-i netcfg/get_domain string lan
d-i netcfg/hostname string seed-metal
# If DHCP is slow/absent, don't drop to an interactive prompt:
d-i netcfg/dhcp_options select Configure network manually
d-i netcfg/disable_autoconfig boolean false

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Accounts — root, key-only (no normal user)
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password-crypted password __ROOT_PW_HASH__

### Partitioning — WIPE THE ONLY DISK (first detected), guided single-partition
# Single-disk box: pick the first real disk at runtime so we never hardcode a
# /dev name. atomic = everything in one partition (+ swap).
d-i partman/early_command string \
  debconf-set partman-auto/disk "$(list-devices disk | head -n1)"; \
  debconf-set grub-installer/bootdev "$(list-devices disk | head -n1)"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/alignment string optimal
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-basicfilesystems/no_swap boolean false

### Base system + packages
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server python3 sudo curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader — auto-detects UEFI vs BIOS
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### Late: install SSH key, harden root login
d-i preseed/late_command string \
  mkdir -p /target/root/.ssh; \
  printf '%s\n' '__SSH_PUBKEY__' > /target/root/.ssh/authorized_keys; \
  chmod 700 /target/root/.ssh; chmod 600 /target/root/.ssh/authorized_keys; \
  in-target sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config; \
  in-target systemctl enable ssh

### Finish — reboot, no prompts
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
