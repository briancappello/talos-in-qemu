---
# The seed's LAN facts (per-host). seed-metal is the bare-metal management node
# on the trusted LAN (192.168.1.0/24). It is STATICALLY addressed (set in the
# host's /etc/network/interfaces) because it IS the fleet's DNS, registry and
# netboot server — consumers reference it by a fixed address, so it must be
# stable and known (a DNS/netboot server cannot be addressed by name).
seed_lan_iface: enp4s0            # the seed's LAN interface
seed_lan_address: 192.168.1.5    # static; what *.lab resolves to + dnsmasq binds
seed_lan_subnet: 192.168.1.0     # the LAN network address (/24 assumed)
seed_dhcp_mode: proxy            # proxyDHCP: netboot only, OpenWrt owns leases
seed_dhcp_range: 192.168.1.240,192.168.1.250,12h   # only used when mode=authoritative
