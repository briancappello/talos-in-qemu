---
all:
  children:
    seed:
      hosts:
        seed-dev:
          ansible_host: 192.168.122.10   # a cloud-init VM on the workstation (libvirt NAT default range)
        seed-metal:
          # Static infra IP (the seed is DNS/registry/netboot for the fleet, so
          # it needs a stable, known address). gmtek owns .10 on both segments.
          ansible_host: 192.168.1.5      # the bare-metal management node
      vars:
        ansible_user: root
