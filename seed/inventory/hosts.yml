---
all:
  children:
    seed:
      hosts:
        seed-dev:
          ansible_host: 192.168.122.10   # a cloud-init VM on the workstation (libvirt NAT default range)
        seed-metal:
          # Resolve by name (OpenWrt/dnsmasq registers the DHCP hostname as
          # seed-metal.lan) — no static IP: gmtek owns .10 on both segments.
          ansible_host: seed-metal.lan   # the bare-metal management node
      vars:
        ansible_user: root
