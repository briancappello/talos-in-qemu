---
# The smallstep/step-ca image runs as its own non-root 'step' user (uid 1000),
# and rootful podman does not remap uids. The quadlet mounts both bind sources
# with podman's :U option, which chowns each source to the container user at
# start, so Ansible only creates the state dir (as root) and leaves the
# container-user ownership to :U.
- name: Ensure the step-ca state dir exists
  ansible.builtin.file:
    path: "{{ seed_state_root }}/step-ca"
    state: directory
    mode: "0700"

- name: Render the step-ca quadlet
  ansible.builtin.template:
    src: step-ca.container.j2
    dest: /etc/containers/systemd/step-ca.container
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Apply pending quadlet changes
  ansible.builtin.meta: flush_handlers

- name: Start step-ca
  ansible.builtin.systemd_service:
    name: step-ca.service
    state: started

- name: Wait for the step-ca root certificate to be written
  ansible.builtin.wait_for:
    path: "{{ seed_state_root }}/step-ca/certs/root_ca.crt"
    timeout: 90
