---
- name: Ensure datastore dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ seed_state_root }}/postgres"
    - "{{ seed_state_root }}/redis"

# The postgres:alpine entrypoint runs as root, then re-execs as the in-image
# `postgres` user (uid 70) for initdb and the init scripts. That unprivileged
# pass must traverse the data mount (PGDATA is a subdir), read the initdb dir,
# and cat the db-password secrets. Root:root 0700/0600 mounts block it, so
# postgres crash-loops on "Permission denied". Own those paths to uid 70.
- name: Own the Postgres data and initdb dirs to the in-image postgres uid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "70"
    group: "70"
    mode: "0700"
  loop:
    - "{{ seed_state_root }}/postgres/data"
    - "{{ seed_state_root }}/postgres/initdb"

- name: Ensure datastore secrets exist
  ansible.builtin.include_tasks: secrets.yml
  vars:
    secret_name: "{{ item }}"
  loop:
    - postgres_password
    - gitea_db_password
    - authentik_db_password

# The init script cats these two secrets while running as the postgres user
# (uid 70); the secrets primitive creates them root:root 0600, unreadable by
# uid 70. Own them to 70 (mode stays 0600). postgres_password is read only in
# the root pass, so it stays root-owned.
- name: Own the DB-role secrets to the in-image postgres uid
  ansible.builtin.file:
    path: "{{ seed_state_root }}/secrets/{{ item }}"
    owner: "70"
    group: "70"
    mode: "0600"
  loop:
    - gitea_db_password
    - authentik_db_password

- name: Render the Postgres init script
  ansible.builtin.template:
    src: postgres-initdb.sh.j2
    dest: "{{ seed_state_root }}/postgres/initdb/10-seed-databases.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render the datastore quadlets
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: "/etc/containers/systemd/{{ item }}.container"
    owner: root
    group: root
    mode: "0644"
  loop:
    - postgres
    - redis
  notify: reload systemd

- name: Apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Start Postgres and Redis
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - postgres.service
    - redis.service

- name: Wait for Postgres to accept connections
  ansible.builtin.command: podman exec postgres pg_isready -U postgres
  register: _pg_ready
  until: _pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
