---
- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - seed_domain is defined and (seed_domain | length > 0)
      - seed_state_root is defined and seed_state_root.startswith('/')
    fail_msg: "seed_domain and an absolute seed_state_root are required"

- name: Ensure the state root exists
  ansible.builtin.file:
    path: "{{ seed_state_root }}"
    state: directory
    owner: root
    group: root
    # 0711: traversable (not listable). dnsmasq drops privileges to the
    # unprivileged 'dnsmasq' user and must traverse here to reach its TFTP
    # root; every secret-bearing subdir keeps its own 0700, so o+x exposes
    # no secrets. Keeping the network daemon unprivileged beats running it
    # as root, and beats leaving the state root fully closed.
    mode: "0711"

- name: Provision podman and the shared network
  ansible.builtin.include_tasks: podman.yml

- name: Ensure the step-ca CA password exists
  ansible.builtin.include_tasks: secrets.yml
  vars:
    secret_name: step_ca_password

- name: Bring up step-ca (internal CA)
  ansible.builtin.include_tasks: step_ca.yml

- name: Bring up Caddy (TLS front door)
  ansible.builtin.include_tasks: caddy.yml

- name: Bring up zot (registry + cache)
  ansible.builtin.include_tasks: zot.yml

- name: Bring up the datastores (Postgres + Redis)
  ansible.builtin.include_tasks: datastores.yml

- name: Bring up Gitea (git + packages)
  ansible.builtin.include_tasks: gitea.yml

- name: Bring up Authentik (SSO)
  ansible.builtin.include_tasks: authentik.yml

- name: Wire Gitea <-> Authentik OIDC
  ansible.builtin.include_tasks: oidc.yml

- name: Bring up dnsmasq (DNS + proxy-DHCP + TFTP)
  ansible.builtin.include_tasks: dnsmasq.yml
