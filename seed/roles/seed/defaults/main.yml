---
# Domain and paths
seed_domain: lab
seed_state_root: /var/lib/seed
# Public boot artifacts (iPXE binaries): deliberately OUTSIDE the 0700
# /var/lib/seed so the host dnsmasq user needs no traverse into the state root.
seed_tftp_root: /srv/tftp

# Container images — pinned, never :latest (Global Constraints)
seed_stepca_image: docker.io/smallstep/step-ca:0.28.1
seed_caddy_image: docker.io/library/caddy:2.10.2
seed_zot_image: ghcr.io/project-zot/zot:v2.1.2
seed_postgres_image: docker.io/library/postgres:16.4-alpine
seed_redis_image: docker.io/library/redis:7.4-alpine
seed_gitea_image: docker.io/gitea/gitea:1.22.6
seed_authentik_image: ghcr.io/goauthentik/server:2024.8.3

# Runtime uid of the in-image postgres user for the pinned postgres:16.4-alpine
# (a debian-based tag would be 999); used to own the data dir postgres must write.
seed_postgres_uid: 70

# Runtime uid of the in-image redis user for redis:7.4-alpine. Redis is started
# with `--save 60 1`, so it forks a BGSAVE child that must WRITE the RDB temp
# file into /data; a root:root mount makes every write fail (MISCONF
# stop-writes-on-bgsave-error), which in turn breaks any Redis-write consumer
# (Authentik). Own the /data mount to this uid, like seed_postgres_uid.
seed_redis_uid: 999

# Gitea runs its app as the in-image `git` user (USER_UID/USER_GID below); the
# /data mount root must be owned by it so it can traverse and write. Matches the
# seed_postgres_uid pattern; non-recursive chown (repos grow, so no :U / recurse).
seed_gitea_uid: 1000

# Authentik's server/worker image (goauthentik/server) runs its process as the
# in-image `authentik` user (uid 1000). The /media and /templates bind mounts
# must be owned by it or the server crash-loops with
# "PermissionError: /media/public" before migrations run. Non-recursive chown,
# matching the seed_postgres_uid / seed_gitea_uid pattern (no :U).
seed_authentik_uid: 1000

# Registry (zot) push user; password lives in secrets/zot_password
seed_registry_user: seed

# Vhost short-names Caddy serves. Each becomes a Caddy NETWORK ALIAS
# (<name>.<seed_domain>) so step-ca can reach Caddy at that name to validate the
# ACME challenge for its certificate. Every phase that adds a Caddy vhost MUST
# add its short-name here, or issuance for that host fails (step-ca cannot
# resolve it in-network). Phase 1 appends: registry, git, auth.
seed_caddy_vhosts:
  - hello
  - registry
  - git
  - auth
