---
# Domain and paths
seed_domain: lab
seed_state_root: /var/lib/seed

# Container images — pinned, never :latest (Global Constraints)
seed_stepca_image: docker.io/smallstep/step-ca:0.28.1
seed_caddy_image: docker.io/library/caddy:2.10.2
seed_zot_image: ghcr.io/project-zot/zot:v2.1.2

# Registry (zot) push user; password lives in secrets/zot_password
seed_registry_user: seed

# Vhost short-names Caddy serves. Each becomes a Caddy NETWORK ALIAS
# (<name>.<seed_domain>) so step-ca can reach Caddy at that name to validate the
# ACME challenge for its certificate. Every phase that adds a Caddy vhost MUST
# add its short-name here, or issuance for that host fails (step-ca cannot
# resolve it in-network). Phase 1 appends: registry, git, auth.
seed_caddy_vhosts:
  - hello
  - registry
