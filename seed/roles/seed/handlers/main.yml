---
- name: reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: restart zot
  ansible.builtin.systemd_service:
    name: zot.service
    state: restarted

- name: update ca trust (debian)
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: update ca trust (redhat)
  ansible.builtin.command: update-ca-trust extract
  changed_when: true

- name: restart caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    state: restarted
